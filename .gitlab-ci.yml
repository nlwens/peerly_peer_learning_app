stages:
  - install
  - lint
  - typecheck
  - test
  - build

variables:
  GIT_DEPTH: 1

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs: []
  cache: []

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline

client:lint:
  stage: lint
  needs: ['install']
  script:
    - npm run lint -w client

client:typecheck:
  stage: typecheck
  needs: ['install']
  script:
    - npm run typecheck -w client

client:test:
  stage: test
  needs: ['install']
  script:
    - npm run test -w client -- --passWithNoTests --coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: client/coverage/cobertura-coverage.xml
    paths:
      - client/coverage/
    expire_in: 30 days

client:build:web:
  stage: build
  needs: ['install']
  script:
    - npm run build:web -w client
  artifacts:
    name: '$CI_COMMIT_REF_SLUG-frontend-web-build'
    paths:
      - client/dist/
    expire_in: 7 days

server:lint:
  extends: .dotnet
  stage: lint
  script:
    - dotnet format server/Peerly.slnx --verify-no-changes

server:test:
  extends: .dotnet
  stage: test
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: peerly_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_CONNECTION_STRING: Host=postgres;Database=peerly_test;Username=postgres;Password=postgres
  script:
    - dotnet test server/Peerly.slnx
